name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, test, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check app tests

      - name: Pytest with coverage (fail under 90% on core/pomdp)
        env:
          USE_LOCAL_MOCKS: "true"
        run: |
          pytest tests -q \
            --cov=app --cov=app.core.pomdp \
            --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=80
          pytest tests/unit -q \
            --cov=app.core.pomdp --cov-report=term-missing --cov-fail-under=90

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

      - name: pip-audit (advisory)
        # ecdsa PYSEC-2026-1325 has no upstream fix and is unused here
        # (auth uses HS256/RS256, never ECDSA).
        run: pip-audit --strict --ignore-vuln PYSEC-2026-1325 || true

  frontend:
    name: Frontend (lint, typecheck, audit, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm install --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests + coverage
        run: npm run coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info

      - name: npm audit (high/critical)
        run: npm audit --audit-level=high || true  # advisory

      - name: Build
        run: npm run build

  docker-build:
    name: Docker build + Trivy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t agentic-rag-backend:ci ./backend

      - name: Trivy image scan (advisory; reports HIGH/CRITICAL)
        # Pinned to the v0.36.0 commit; trivy-action migrated all tags to a
        # `v` prefix after a supply-chain incident, so bare tags no longer
        # resolve. Advisory (exit-code 0) to match pip-audit/npm audit:
        # base-image (python:3.11-slim) CVEs should not block the pipeline.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: agentic-rag-backend:ci
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [lab-budget, full]
    defaults:
      run:
        working-directory: infra/terraform/environments/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Format check
        run: terraform fmt -check -recursive ../../

      - name: Init (no backend)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

  sonarqube:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Backend coverage (xml)
        working-directory: backend
        env:
          USE_LOCAL_MOCKS: "true"
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest tests -q --cov=app --cov-report=xml

      - name: Frontend coverage (lcov)
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run coverage

      - name: SonarQube scan (runs only when SONAR_TOKEN is configured)
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
