[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag-pomdp-backend"
version = "0.1.0"
description = "POMDP-based Adaptive Agentic RAG framework (backend)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "M.Tech Dissertation" }]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "httpx>=0.27",
    "boto3>=1.34",
    "opensearch-py>=2.4",
    "faiss-cpu>=1.8; platform_system != 'Windows'",
    "python-jose[cryptography]>=3.3",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.9",
    "orjson>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "moto>=5.0",
    "ruff>=0.4",
    "pip-audit>=2.7",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
# B008: FastAPI Depends() in defaults is idiomatic.
# UP042: `class X(str, Enum)` is a deliberate JSON-serialisable enum pattern.
ignore = ["B008", "UP042"]
