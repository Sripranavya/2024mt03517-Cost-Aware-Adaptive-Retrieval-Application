# SonarQube / SonarCloud configuration for the Cost-Aware Adaptive Retrieval
# (POMDP Agentic RAG) monorepo — backend (Python) + frontend (TypeScript).
#
# Run locally against a SonarQube server:
#   1. Backend coverage:  cd backend && pytest --cov=app --cov-report=xml
#   2. Frontend coverage: cd frontend && npm run coverage
#   3. Scan:              sonar-scanner -Dsonar.host.url=... -Dsonar.token=...

sonar.projectKey=Sripranavya_2024mt03517-Cost-Aware-Adaptive-Retrieval-Application
sonar.projectName=Cost-Aware Adaptive Retrieval (POMDP Agentic RAG)
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8

# --- Sources (production code) ---
sonar.sources=backend/app,frontend/src,scripts

# --- Tests (co-located frontend tests disambiguated via test.inclusions) ---
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=backend/tests/**/*.py,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx

# --- Language settings ---
sonar.python.version=3.11

# --- Coverage reports (generated by the commands above) ---
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# --- Analysis exclusions (generated / vendored / non-logic) ---
sonar.exclusions=**/node_modules/**,**/.venv/**,**/__pycache__/**,**/dist/**,**/*.egg-info/**,frontend/e2e/**,**/*.d.ts

# --- Coverage exclusions (entrypoints, tests, IaC, scripts, cloud-only glue) ---
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,frontend/src/main.tsx,frontend/src/test/**,scripts/**,backend/app/main.py,backend/conftest.py

# --- Duplication exclusions ---
sonar.cpd.exclusions=infra/**,**/*.test.ts,**/*.test.tsx
